name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build mcp_server
      - name: Validate MCP Registry metadata
        shell: pwsh
        run: |
          @'
          import json
          import re
          from pathlib import Path

          registry = json.loads(Path("server.json").read_text(encoding="utf-8"))
          pyproject = Path("mcp_server/pyproject.toml").read_text(encoding="utf-8")
          version = re.search(r'(?m)^version\s*=\s*"([^"]+)"$', pyproject).group(1)
          assert registry["name"] == "io.github.yxy050208/multisim-mcp"
          assert registry["version"] == version
          package = registry["packages"][0]
          assert package["registryType"] == "pypi"
          assert package["identifier"] == "multisim-mcp"
          assert package["version"] == version
          assert package["transport"]["type"] == "stdio"
          readme = Path("mcp_server/README.md").read_text(encoding="utf-8")
          assert "mcp-name: io.github.yxy050208/multisim-mcp" in readme
          '@ | python -
      - name: Install built wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem mcp_server/dist/*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName
          python -m pip check
      - name: Smoke-test installed CLI
        shell: pwsh
        run: |
          multisim-mcp --help
          multisim-mcp --json doctor | Out-File -Encoding utf8 doctor.json
          @'
          import json
          from pathlib import Path

          result = json.loads(Path("doctor.json").read_text(encoding="utf-8-sig"))
          assert result["command"] == "doctor"
          assert result["success"] is True
          assert result["introspection_ready"] is True
          '@ | python -
          multisim-mcp config --client generic --python $((Get-Command python).Source)
      - name: Compile installed sources
        run: python -m compileall mcp_server
      - name: Run COM-free tests against installed wheel
        run: python -m unittest discover -s mcp_server/tests -v
      - name: Verify public artifact contents
        shell: pwsh
        run: |
          @'
          from importlib.resources import files
          from pathlib import Path
          import tarfile
          import zipfile
          import multisim_mcp

          package = files("multisim_mcp")
          assert package.joinpath("templates/manifest.json").is_file()
          wheels = list(Path("mcp_server/dist").glob("*.whl"))
          assert wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert any(name.endswith("licenses/LICENSE") for name in names)
              assert not any("/templates/" in name and name.endswith(".xml") for name in names)
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode("utf-8")
              assert "mcp-name: io.github.yxy050208/multisim-mcp" in metadata
          sdists = list(Path("mcp_server/dist").glob("*.tar.gz"))
          assert sdists
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
              assert any(name.endswith("/LICENSE") for name in names)
              assert any(name.endswith("/multisim_mcp/templates/manifest.json") for name in names)
              assert not any("/templates/" in name and name.endswith(".xml") for name in names)
          print("Code-only wheel and sdist contain manifest/license and no extracted XML")
          '@ | python -
      - name: Compile release audit and local-pack tools
        run: python -m compileall tools/release_audit.py tools/bootstrap_local_component_pack.py tools/extract_native_component_templates.py

  linux-introspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Build introspection-only image
        run: docker build --tag multisim-mcp-glama .
      - name: Verify Linux runtime diagnostics
        run: |
          docker run --rm -i multisim-mcp-glama python - <<'PY'
          from multisim_mcp.multisim_client import runtime_diagnostics

          result = runtime_diagnostics()
          assert result["windows"] is False
          assert result["runtime_compatible"] is False
          assert result["runtime_mode"] == "introspection-only"
          print(result)
          PY
      - name: Verify MCP initialize and tool introspection through Docker stdio
        run: |
          python -m pip install "mcp>=1.2.0,<2"
          python - <<'PY'
          import asyncio
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(
                  command="docker",
                  args=["run", "--rm", "-i", "multisim-mcp-glama"],
              )
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      response = await session.list_tools()
              names = {tool.name for tool in response.tools}
              assert "runtime_status" in names
              assert "run_circuit_experiment" in names
              print(f"Introspection returned {len(names)} tools")

          asyncio.run(main())
          PY
